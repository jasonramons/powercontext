services:
  study-buddy:
    build: .
    image: ${DOCKER_USER:-local}/study-buddy:1.0.0
    container_name: study-buddy
    ports:
      - "8788:8788"
    volumes:
      - ./data:/data
    environment:
      PORT: "8788"
      PC_BRIDGE_PORT: "8766"
      PC_DB: /data/powercontext.db
      SEEPDB_PATH: /data/seekdb.db
      STUDY_DATA_DIR: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
