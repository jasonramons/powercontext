services:
  powercontext:
    build:
      context: .
      dockerfile: Dockerfile.powercontext
    container_name: study-buddy-powercontext
    ports:
      - "8010:8010"
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: 8010
      POWERCONTEXT_SERVER_ALLOW_INSECURE_HTTP: "true"
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_WORKSPACE: /workspace
      POWERCONTEXT_SERVER_RUNTIME_ARTIFACT_PROCESSING_ROLE: all
    volumes:
      - powercontext-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  study-buddy:
    build: .
    container_name: study-buddy
    ports:
      - "8080:8080"
      - "3000:3000"
      - "8766:8766"
    environment:
      PORT: "8080"
      POWERCONTEXT_URL: http://powercontext:8010
    volumes:
      - study-data:/app/data
    depends_on:
      powercontext:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  powercontext-data:
  study-data:
