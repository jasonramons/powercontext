services:
  study-buddy:
    build: .
    container_name: study-buddy
    ports:
      - "8080:8080"
      - "3000:3000"
      - "8766:8766"
    environment:
      PORT: "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
